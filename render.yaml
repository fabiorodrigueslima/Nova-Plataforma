services:
  - type: web
    name: postfan
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Banco hospedado no Supabase (Session pooler). Configure o valor no painel do Render.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 1014036348694-5l3nn8l04q8legmtar6c0pbde44sse39.apps.googleusercontent.com
      - key: VITE_GOOGLE_CLIENT_ID
        value: 1014036348694-5l3nn8l04q8legmtar6c0pbde44sse39.apps.googleusercontent.com
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_SECURE
        value: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
